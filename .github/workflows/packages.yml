# Build the lt-eid packages: an RPM on each Fedora release and a .deb on each
# Ubuntu release listed below. Every run uploads each package as a workflow
# artifact; a pushed v* tag (e.g. v0.1.0-5) also attaches them to a release.
# The file names tell the releases apart (fc44, fc45, ubuntu24.04,
# ubuntu26.04).
name: Packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora ${{ matrix.fedora }}
    strategy:
      # A failure on one Fedora release still shows how the others do.
      fail-fast: false
      matrix:
        fedora: [44, 45]
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build tools
        run: dnf -y install git rpm-build rpmdevtools dnf5-plugins rust-srpm-macros systemd-rpm-macros

      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: dnf -y builddep packaging/lt-eid.spec

      # make-sources.sh makes the OpenSC snapshot tarball from a git tree.
      - name: Fetch OpenSC
        run: git clone --filter=blob:none --no-checkout https://github.com/OpenSC/OpenSC.git "$RUNNER_TEMP/OpenSC"

      - name: Prepare sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OPENSC_SRC="$RUNNER_TEMP/OpenSC" packaging/make-sources.sh

      - name: Build
        run: rpmbuild -bb packaging/lt-eid.spec

      - name: Collect RPMs
        run: |
          mkdir rpms
          cp "$(rpm --eval %_rpmdir)"/*/*.rpm rpms/
          ls -l rpms

      # Uploaded as-is, not zipped, and named after the file. The debuginfo
      # and debugsource packages are built too, but not kept.
      - uses: actions/upload-artifact@v7
        with:
          path: rpms/lt-eid-[0-9]*.x86_64.rpm
          archive: false

  deb:
    name: Ubuntu ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get -y install git ca-certificates

      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: apt-get -y build-dep ./packaging

      # make-deb.sh takes the OpenSC snapshot from a git tree.
      - name: Fetch OpenSC
        run: git clone --filter=blob:none --no-checkout https://github.com/OpenSC/OpenSC.git "$RUNNER_TEMP/OpenSC"

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OPENSC_SRC="$RUNNER_TEMP/OpenSC" packaging/make-deb.sh

      # Uploaded as-is, not zipped, and named after the file. The debug
      # symbols package (.ddeb) is built too, but not kept.
      - uses: actions/upload-artifact@v7
        with:
          path: target/deb/lt-eid_*.deb
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every artifact of the run is a package.
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: packages

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
