# Build the lt-eid RPM on each Fedora release listed below. Every run uploads
# each RPM as a workflow artifact; a pushed v* tag (e.g. v0.1.0-5) also
# attaches them to a release. The file names tell the Fedora releases apart
# (fc44, fc45).
name: RPM

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fedora ${{ matrix.fedora }}
    strategy:
      # A failure on one Fedora release still shows how the others do.
      fail-fast: false
      matrix:
        fedora: [44, 45]
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build tools
        run: dnf -y install git rpm-build rpmdevtools dnf5-plugins rust-srpm-macros systemd-rpm-macros

      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: dnf -y builddep packaging/lt-eid.spec

      # make-sources.sh makes the OpenSC snapshot tarball from a git tree.
      - name: Fetch OpenSC
        run: git clone --filter=blob:none --no-checkout https://github.com/OpenSC/OpenSC.git "$RUNNER_TEMP/OpenSC"

      - name: Prepare sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OPENSC_SRC="$RUNNER_TEMP/OpenSC" packaging/make-sources.sh

      - name: Build
        run: rpmbuild -ba packaging/lt-eid.spec

      - name: Collect RPMs
        run: |
          mkdir rpms
          cp "$(rpm --eval %_rpmdir)"/*/*.rpm "$(rpm --eval %_srcrpmdir)"/*.rpm rpms/
          ls -l rpms

      # Uploaded as-is, not zipped: one file per upload, named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: rpms/lt-eid-[0-9]*.x86_64.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: rpms/lt-eid-debuginfo-*.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: rpms/lt-eid-debugsource-*.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: rpms/*.src.rpm
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*.rpm"
          merge-multiple: true
          path: rpms

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rpms/*.rpm --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
