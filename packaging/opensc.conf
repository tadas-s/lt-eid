app default {
	# debug = 3;
	# debug_file = opensc-debug.txt;

	# Only the Lithuanian eID driver is needed in this build.
	card_drivers = lteid;

	# lt-eidd owns the card: keep other PC/SC clients out while it is
	# connected. The shared-mode config is kept as opensc.conf.shared.
	reader_driver pcsc {
		connect_exclusive = true;
	}

	# Lithuanian national ID card (asmens tapatybės kortelė)
	card_atr 3b:9d:18:81:31:fc:35:80:31:c0:69:4d:54:43:4f:53:73:02:00:00:00 {
		atrmask = ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:00:00:00;
		driver = lteid;
		type = 43000;
	}
}

app opensc-pkcs11 {
	pkcs11 {
		create_slots_for_pins = "user,sign";
	}
}
