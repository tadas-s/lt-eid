[workspace]
resolver = "3"
members = ["proto", "pkcs11", "daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
lt-eid-proto = { path = "proto" }
# Raw PKCS#11 type/constant definitions generated from the OASIS headers.
cryptoki-sys = "0.5.0"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[profile.release]
# A panic must never unwind into the calling C application.
panic = "abort"
