[package]
name = "lt-eid-signing-server"
description = "Elpako Signer compatible web service for logging in with the Lithuanian eID"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lt-eid-signing-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cryptoki = "0.12"
serde_json = "1"
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
x509-parser = "0.18"
